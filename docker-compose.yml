version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: salespulse_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: salespulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  web:
    build: .
    container_name: salespulse_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: salespulse
      SECRET_KEY: salespulse-production-super-secret-key-2026
    ports:
      - "5001:5000"

volumes:
  mysql_data:
