{% extends "base.html" %}

{% block title %}Login — SalesPulse{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center flex-grow-1 p-3">
  <div class="card shadow-lg border-0" style="max-width: 440px; width: 100%; border-radius: 16px;">
    <div class="card-body p-4 p-md-5">
      
      <!-- Brand Logo / Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-brand text-white rounded-circle mb-3 shadow" style="width: 58px; height: 58px;">
          <i class="bi bi-graph-up-arrow fs-4 text-warning"></i>
        </div>
        <h3 class="fw-bold text-dark m-0">SalesPulse</h3>
        <p class="text-muted small mt-1">Small Business Sales & Inventory Analytics</p>
      </div>

      <!-- Login Form -->
      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or '' }}" placeholder="e.g. owner@salespulse.com" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-teal text-white w-100 py-2 fw-semibold shadow-sm" style="background-color: #0F766E;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <!-- Demo Credentials Guide -->
      <div class="mt-4 pt-3 border-top text-center">
        <span class="badge bg-light text-muted border mb-2">Demo Credentials</span>
        <div class="small text-secondary d-flex justify-content-around">
          <div>
            <strong>Owner:</strong><br>
            <code>owner@salespulse.com</code><br>
            <code>Owner@123</code>
          </div>
          <div class="border-start ps-3">
            <strong>Staff:</strong><br>
            <code>staff@salespulse.com</code><br>
            <code>Staff@123</code>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
