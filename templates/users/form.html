{% extends "base.html" %}

{% block title %}Create Staff Account — SalesPulse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold m-0 text-dark">Create Staff User</h3>
        <p class="text-muted small m-0 mt-1">Add a new cashier login to record sales.</p>
      </div>
      <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Users
      </a>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="name" class="form-label small fw-semibold text-secondary">Full Name *</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ user.name or '' }}" placeholder="e.g. Ramesh Kumar" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold text-secondary">Email Address *</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email or '' }}" placeholder="e.g. cashier1@salespulse.com" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold text-secondary">Password *</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" required>
          </div>

          <div class="mb-4">
            <label for="role" class="form-label small fw-semibold text-secondary">Account Role</label>
            <select class="form-select" id="role" name="role">
              <option value="STAFF" selected>STAFF (Cashier - Billing Only)</option>
              <option value="OWNER">OWNER (Full Administrative Access)</option>
            </select>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-teal text-white fw-semibold" style="background-color: #0F766E;">
              <i class="bi bi-check-lg me-1"></i> Create Account
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
