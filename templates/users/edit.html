{% extends "base.html" %}

{% block title %}Edit User Account — SalesPulse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold m-0 text-dark">Edit User Account</h3>
        <p class="text-muted small m-0 mt-1">Update profile information and credentials.</p>
      </div>
      <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Users
      </a>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="name" class="form-label small fw-semibold text-secondary">Full Name *</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" placeholder="e.g. Misbah Khan" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label small fw-semibold text-secondary">Email Address *</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" placeholder="e.g. owner@salespulse.com" required>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-secondary">New Password (leave blank to keep current)</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password if changing">
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-teal text-white fw-semibold" style="background-color: #0F766E;">
              <i class="bi bi-check-lg me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
